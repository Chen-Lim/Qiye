<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>栖页 · 专注中</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7f4; color: #30292a; }
    main { width: min(560px, calc(100vw - 40px)); padding: 40px; border: 1px solid #e6dcda; border-radius: 12px; background: #fffdfb; box-shadow: 0 4px 12px rgb(48 41 42 / 6%); }
    .eyebrow { margin: 0 0 10px; color: #716569; font-size: 13px; font-weight: 600; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 42px); line-height: 1.12; }
    p { margin: 0; color: #716569; line-height: 1.7; }
    .actions { display: grid; gap: 10px; margin-top: 30px; }
    button { min-height: 44px; padding: 0 18px; border: 1px solid #cbbebf; border-radius: 8px; background: #fffdfb; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #f6efef; }
    button.primary { border-color: #bd8997; background: #bd8997; color: #302328; }
    button.primary:hover { background: #b27f8e; }
    button:focus-visible { outline: 2px solid #875465; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .55; }
    #status { min-height: 24px; margin-top: 16px; color: #875465; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; }
      body { background: #1b1819; color: #f4eceb; }
      main { background: #272123; border-color: #53464b; box-shadow: none; }
      p, .eyebrow { color: #c6b6bb; }
      button { background: #30282c; border-color: #76616a; color: #f4eceb; }
      button:hover { background: #382e32; }
      button.primary { background: #cda0ad; border-color: #cda0ad; color: #282024; }
      button.primary:hover { background: #dbb5bf; }
      button:focus-visible { outline-color: #dfb3c0; }
      #status { color: #dfb3c0; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Focus Timer</p>
    <h1>现在是专注时间</h1>
    <p>此页面不在本次专注允许的域名中。你可以返回、结束专注，或仅在本次专注中允许此域名。</p>
    <div class="actions" aria-label="专注操作">
      <button type="button" data-action="return">返回</button>
      <button type="button" data-action="stop">结束专注</button>
      <button type="button" class="primary" data-action="allow">本次允许此域名</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="ui/blocked.js"></script>
</body>
</html>
