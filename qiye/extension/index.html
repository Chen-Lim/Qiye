<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>栖页</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="header" class="header">
      <div class="header__left">
        <h1 class="brand">栖页</h1>
        <span class="header__separator" aria-hidden="true">·</span>
        <p class="status">启动中…</p>
      </div>
      <div class="header__right">
        <button id="privateModeToggle" class="headerWidget__btn" title="暂停记录"></button>
        <button id="focusTimerToggle" class="headerWidget__btn" title="专注计时"></button>
        <button id="settingsToggle" class="headerWidget__btn" title="设置" aria-controls="settingsPanel" aria-expanded="false">
          <span class="headerWidget__icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
          <span class="headerWidget__text">设置</span>
        </button>
        <button id="historyToggle" class="headerWidget__btn" title="统计" aria-controls="historyPanel" aria-expanded="false">
          <span class="headerWidget__icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
          <span class="headerWidget__text">统计</span>
        </button>
        <div class="todayWork" id="todayWork" title="今日累计工作时长（时:分:秒）" hidden>
          <span class="todayWork__label">今日工作</span>
          <span class="todayWork__value" id="todayWorkValue" role="timer" aria-live="off">00:00:00</span>
          <span class="todayWork__dot" id="todayWorkDot" aria-hidden="true"></span>
        </div>
      </div>
    </header>
    <section id="settingsPanel" class="settingsPanel" hidden></section>
    <section id="historyPanel" class="historyPanel" hidden></section>
    <main id="main">
      <section class="openTabs" aria-labelledby="openTabsTitle">
        <div class="sectionHeading">
          <h2 id="openTabsTitle">已打开标签页</h2>
          <span class="sectionHeading__rule" aria-hidden="true"></span>
          <span id="openTabsSummary" class="sectionHeading__meta"></span>
        </div>
        <section id="tabsGrid" class="tabsGrid" aria-label="按网站分组的标签页"></section>
      </section>
      <aside id="sidebar" class="sidebar" hidden></aside>
    </main>
  </div>
  <script type="module" src="ui/main.js"></script>
</body>
</html>
