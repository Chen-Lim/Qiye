name: Check extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QIYE_SCREENSHOT_DIR: ${{ runner.temp }}/qiye-browser-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run regression tests
        run: node extension/tests/nodeRunner.mjs
      - name: Check background startup
        run: node extension/tests/swSmoke.mjs
      - name: Install browser acceptance dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chrome
      - name: Run Chrome browser acceptance
        run: node extension/tests/browser-ui.mjs
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qiye-browser-check
          path: ${{ env.QIYE_SCREENSHOT_DIR }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Package extension
        run: python3 scripts/package.py
      - name: Upload download packages
        uses: actions/upload-artifact@v4
        with:
          name: qiye-packages
          path: dist/*.zip
          if-no-files-found: error
